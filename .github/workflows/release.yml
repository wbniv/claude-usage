name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package version
        run: |
          set -euo pipefail
          pkg_ver=$(grep '^Version:' packaging/control | awk '{print $2}')
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$pkg_ver" != "$tag_ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packaging/control version $pkg_ver" >&2
            exit 1
          fi

      - name: Install go-task
        uses: arduino/setup-task@v2

      - name: Test Chrome extension
        run: task test-scraper

      - name: Install pytest
        run: python3 -m pip install --user pytest

      - name: Test server validator
        run: task test-validate

      - name: Cache 24.04 test image
        uses: actions/cache@v4
        id: docker-cache-2404
        with:
          path: /tmp/test-image-2404.tar
          key: deb-test-image-2404-${{ hashFiles('packaging/control', 'packaging/test-deb.Dockerfile') }}

      - name: Load cached 24.04 image
        if: steps.docker-cache-2404.outputs.cache-hit == 'true'
        run: docker load -i /tmp/test-image-2404.tar

      - name: Build 24.04 test image (cache miss)
        if: steps.docker-cache-2404.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          deps=$(grep '^Depends:' packaging/control | sed 's/^Depends: //; s/([^)]*)//g; s/,//g')
          docker build --build-arg BASE=ubuntu:24.04 --build-arg DEPS="$deps" \
            -f packaging/test-deb.Dockerfile -t claude-usage-test:24.04 packaging/
          docker save claude-usage-test:24.04 -o /tmp/test-image-2404.tar

      - name: Cache 25.10 test image
        uses: actions/cache@v4
        id: docker-cache-2510
        with:
          path: /tmp/test-image-2510.tar
          key: deb-test-image-2510-${{ hashFiles('packaging/control', 'packaging/test-deb.Dockerfile') }}

      - name: Load cached 25.10 image
        if: steps.docker-cache-2510.outputs.cache-hit == 'true'
        run: docker load -i /tmp/test-image-2510.tar

      - name: Build 25.10 test image (cache miss)
        if: steps.docker-cache-2510.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          deps=$(grep '^Depends:' packaging/control | sed 's/^Depends: //; s/([^)]*)//g; s/,//g')
          docker build --build-arg BASE=ubuntu:25.10 --build-arg DEPS="$deps" \
            -f packaging/test-deb.Dockerfile -t claude-usage-test:25.10 packaging/
          docker save claude-usage-test:25.10 -o /tmp/test-image-2510.tar

      - name: Build .deb
        run: task build

      - name: Extract version
        id: version
        run: echo "version=$(grep '^Version:' packaging/control | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Static test .deb on 24.04
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/test-deb-verify.sh:/usr/local/bin/verify:ro" \
            claude-usage-test:24.04 bash -c "
            set -euo pipefail
            dpkg -i /dist/claude-usage_${{ steps.version.outputs.version }}_all.deb
            /usr/local/bin/verify
          "

      - name: Static test .deb on 25.10
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/test-deb-verify.sh:/usr/local/bin/verify:ro" \
            claude-usage-test:25.10 bash -c "
            set -euo pipefail
            dpkg -i /dist/claude-usage_${{ steps.version.outputs.version }}_all.deb
            /usr/local/bin/verify
          "

      # Live smoke test: install the .deb directly on the bare runner (which
      # has real systemd as PID 1), create a fresh user, start the service,
      # POST a probe payload, verify the cache write. This is the gate that
      # would have caught R-1 (218/CAPABILITIES regression from commit 0db082c).
      # Runs on 24.04 only — GH Actions does not yet offer a 25.10 runner, so
      # 25.10 systemd capability behavior is verified locally before tag push.
      - name: Live smoke test on bare 24.04 runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y "$PWD/dist/claude-usage_${{ steps.version.outputs.version }}_all.deb"
          sudo bash packaging/test-deb-live.sh cu-smoke

      - name: Build Chrome extension zip
        run: task build-chrome-zip

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/claude-usage_${{ steps.version.outputs.version }}_all.deb" \
            "dist/claude-usage-chrome-${{ steps.version.outputs.version }}.zip" \
            --title "Claude Usage ${{ github.ref_name }}" \
            --generate-notes
