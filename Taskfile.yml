version: "3"

vars:
  VERSION:
    sh: |
      v=$(grep '^Version:' packaging/control | awk '{print $2}')
      if [ -z "$v" ]; then
        echo "ERROR: no Version: line in packaging/control" >&2
        exit 1
      fi
      echo "$v"
  DEB: dist/claude-usage_{{.VERSION}}_all.deb
  CHROME_ZIP: dist/claude-usage-chrome-{{.VERSION}}.zip

tasks:
  test-scraper:
    desc: Run Chrome extension unit tests (scraper + background load-smoke)
    cmds:
      - node --test chrome-extension/test/scraper.test.js chrome-extension/test/background-load.test.js

  test-validate:
    desc: Run server-side validator pytest suite (input contract for usage-server.py)
    cmds:
      - python3 -m pytest server/tests/ -v

  lint-scraper-parity:
    desc: "Parity lints for hand-synced pairs: scraper.js↔background.js inline (regex sets) and pacingPct↔pacing_pct (numeric constants)"
    cmds:
      - python3 scripts/lint-scraper-parity.py

  lint-security-doc:
    desc: "SD-1 (pass-18): assert SECURITY.md's outbound-URL claim matches chrome-extension/manifest.json host_permissions"
    cmds:
      - python3 scripts/lint-security-doc.py

  gen-js-defaults:
    desc: "JS-1 (pass-18): regenerate gnome-extension/_defaults.js from the gschema XML"
    cmds:
      - python3 scripts/gen-js-defaults.py

  lint-js-defaults:
    desc: "JS-1 (pass-18): assert gnome-extension/_defaults.js is in sync with the gschema XML"
    cmds:
      - python3 scripts/gen-js-defaults.py --check

  gen-kde-config:
    desc: "KDE: regenerate kde-plasmoid/contents/config/main.xml (KConfigXT) from the gschema XML"
    cmds:
      - python3 scripts/gen-kde-config.py

  lint-kde-config:
    desc: "KDE: assert kde-plasmoid/contents/config/main.xml is in sync with the gschema XML"
    cmds:
      - python3 scripts/gen-kde-config.py --check

  test:
    desc: Run all unit tests + parity/security lints
    cmds:
      - task: test-scraper
      - task: test-validate
      - task: lint-scraper-parity
      - task: lint-security-doc
      - task: lint-js-defaults
      - task: lint-kde-config

  build:
    desc: Build the .deb package
    cmds:
      - bash packaging/build-deb.sh
    generates:
      - "{{.DEB}}"

  build-chrome-zip:
    desc: Build the Chrome extension zip for CWS upload
    cmds:
      - bash packaging/build-chrome-zip.sh
    generates:
      - "{{.CHROME_ZIP}}"

  test-deb:
    desc: "Install + verify .deb in a clean Ubuntu 24.04 container (validates Depends end-to-end; ~7 min cold, ~4 min warm)"
    deps: [build]
    cmds:
      - |
        # Apt cache reused across runs via docker named volumes.
        # Bust with: docker volume rm claude-usage-apt-archives claude-usage-apt-lists
        docker run --rm \
          -v "$PWD/dist:/dist:ro" \
          -v "$PWD/packaging/test-deb-verify.sh:/usr/local/bin/verify:ro" \
          -v claude-usage-apt-archives:/var/cache/apt/archives \
          -v claude-usage-apt-lists:/var/lib/apt/lists \
          ubuntu:24.04 bash -c '
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y /dist/claude-usage_{{.VERSION}}_all.deb
          /usr/local/bin/verify
        '

  build-test-image:
    desc: Build claude-usage-test:latest with all .deb deps prebaked (rebuilds when packaging/control changes)
    sources:
      - packaging/control
      - packaging/test-deb.Dockerfile
    cmds:
      - |
        # Strip version constraints and commas from the Depends: line so we can
        # feed it straight to `apt-get install` inside the Dockerfile.
        deps=$(grep '^Depends:' packaging/control | sed 's/^Depends: //; s/([^)]*)//g; s/,//g')
        echo "Building claude-usage-test:latest with deps: $deps"
        docker build \
          --build-arg DEPS="$deps" \
          -f packaging/test-deb.Dockerfile \
          -t claude-usage-test:latest \
          packaging/

  test-deb-fast:
    desc: "Install + verify .deb on the prebaked image (~10 s; assumes Depends still resolves — use test-deb before release)"
    deps: [build, build-test-image]
    cmds:
      - |
        docker run --rm \
          -v "$PWD/dist:/dist:ro" \
          -v "$PWD/packaging/test-deb-verify.sh:/usr/local/bin/verify:ro" \
          claude-usage-test:latest bash -c '
          set -euo pipefail
          dpkg -i /dist/claude-usage_{{.VERSION}}_all.deb
          /usr/local/bin/verify
        '

  test-gnome:
    desc: "Smoke-test GNOME extension loading on a given Ubuntu release via Docker headless gnome-shell (UBUNTU_VERSION=26.04)"
    vars:
      UBUNTU_VERSION: '{{.UBUNTU_VERSION | default "26.04"}}'
    cmds:
      - >
        docker build
        --build-arg UBUNTU_VERSION={{.UBUNTU_VERSION}}
        -f packaging/test-gnome.Dockerfile
        -t claude-usage-gnome-{{.UBUNTU_VERSION}} .
      - docker run --rm claude-usage-gnome-{{.UBUNTU_VERSION}}

  test-kde:
    desc: "Smoke-test the KDE plasmoid on Plasma 6 via Docker (Xvfb + plasmoidviewer headless load check; ~3 min cold for the plasma-desktop image)"
    cmds:
      - task: lint-kde-config
      - >
        docker build
        -f packaging/test-kde.Dockerfile
        -t claude-usage-kde .
      - >
        docker run --rm
        -v "$PWD/kde-plasmoid:/plasmoid:ro"
        -v "$PWD/packaging/test-kde-verify.sh:/verify.sh:ro"
        claude-usage-kde

  bump:
    desc: "Bump version across packaging/control + chrome-extension/manifest.json (NEW=X.Y.Z). Pass-17 P-2: kills the manual two-place sync that auto-memory used to track."
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.NEW}}" ]; then
          echo "Usage: task bump NEW=X.Y.Z" >&2
          exit 1
        fi
        if ! echo "{{.NEW}}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Invalid version {{.NEW}} (expected X.Y.Z)" >&2
          exit 1
        fi
        sed -i "s/^Version: .*/Version: {{.NEW}}/" packaging/control
        python3 -c "import json,pathlib; p=pathlib.Path('chrome-extension/manifest.json'); d=json.loads(p.read_text()); d['version']='{{.NEW}}'; p.write_text(json.dumps(d,indent=2)+'\n')"
        echo "Bumped to {{.NEW}}. Review:"
        grep '^Version:' packaging/control
        grep '"version"' chrome-extension/manifest.json
        echo "Note: gnome-extension/metadata.json's integer version is bumped automatically by 'task release'."

  release:
    desc: Preflight checks, tag, and push — CI builds and publishes the release (VERSION= to override)
    vars:
      TAG: v{{.VERSION}}
    cmds:
      - task: test
      - |
        set -euo pipefail
        current=$(git rev-parse --abbrev-ref HEAD)
        if [ "$current" != "main" ]; then
          echo "Refusing to release from non-main branch: $current"
          exit 1
        fi
        # docs/transcripts/ holds auto-generated session logs that almost
        # always have pending edits when `task release` runs. They get
        # committed separately via housekeeping commits (e.g. `chore:
        # session transcript through X`); excluding them here keeps the
        # release flow from tripping on benign churn.
        if ! git diff --quiet HEAD -- . ':(exclude)docs/transcripts/'; then
          echo "Refusing to release with uncommitted changes (transcripts excluded):" >&2
          git status --short -- . ':(exclude)docs/transcripts/'
          exit 1
        fi
        if git rev-parse "{{.TAG}}" >/dev/null 2>&1; then
          echo "Tag {{.TAG}} already exists — bump Version in packaging/control first"
          exit 1
        fi
        # packaging/control and chrome-extension/manifest.json must agree on
        # the version string — they ship in the same release and a drift
        # produces a .deb labelled X and a Chrome zip labelled Y.
        ctl_ver=$(grep '^Version:' packaging/control | awk '{print $2}')
        ext_ver=$(python3 -c 'import json; print(json.load(open("chrome-extension/manifest.json"))["version"])')
        if [ "$ctl_ver" != "$ext_ver" ]; then
          echo "Version mismatch: packaging/control=$ctl_ver, chrome-extension/manifest.json=$ext_ver" >&2
          exit 1
        fi
        # Auto-increment the GNOME extension integer version (EGO requirement).
        # Runs after all guards so a wrong-branch/dirty-tree abort never mutates the file.
        python3 -c "import json,pathlib; p=pathlib.Path('gnome-extension/metadata.json'); d=json.loads(p.read_text()); d['version']+=1; p.write_text(json.dumps(d,indent=2)+chr(10))"
        git add gnome-extension/metadata.json
        git commit -m "chore: bump gnome extension version for release"
      - git push origin main
      - git tag "{{.TAG}}"
      - git push origin "{{.TAG}}"
      - |
        echo "Tag {{.TAG}} pushed — GitHub Actions will build, test, and publish the release."
        rm -f dist/*.deb dist/*.zip
        echo "Local dist/ artifacts removed (CI uploads the canonical copies)."

  md:
    desc: Preview a markdown file in the browser
    cmds:
      - bash ../python-tui-lib/scripts/md-to-pdf.sh {{.CLI_ARGS}}
