version: "3"

vars:
  VERSION:
    sh: grep '^Version:' packaging/control | awk '{print $2}'
  DEB: dist/claude-usage_{{.VERSION}}_all.deb
  CHROME_ZIP: dist/claude-usage-chrome-{{.VERSION}}.zip

tasks:
  build:
    desc: Build the .deb package
    cmds:
      - bash packaging/build-deb.sh
    generates:
      - "{{.DEB}}"

  build-chrome-zip:
    desc: Build the Chrome extension zip for CWS upload
    cmds:
      - bash packaging/build-chrome-zip.sh
    generates:
      - "{{.CHROME_ZIP}}"

  test-deb:
    desc: Build, install, verify, and remove the .deb in a clean Ubuntu 24.04 container (apt cache reused across runs)
    deps: [build]
    cmds:
      - |
        # Persistent apt cache via docker named volumes: ~5 min cold → ~30 s warm.
        # To bust: docker volume rm claude-usage-apt-archives claude-usage-apt-lists
        docker run --rm \
          -v "$PWD/dist:/dist:ro" \
          -v claude-usage-apt-archives:/var/cache/apt/archives \
          -v claude-usage-apt-lists:/var/lib/apt/lists \
          ubuntu:24.04 bash -c '
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y /dist/claude-usage_{{.VERSION}}_all.deb
          # Shipped binaries
          test -x /usr/bin/claude-usage-setup
          test -x /usr/bin/claude-usage-status
          # Shipped server
          test -f /usr/share/claude-usage/generate-icon.py
          test -f /usr/share/claude-usage/usage-server.py
          # Extension + compiled schema in both locations
          test -f /usr/share/gnome-shell/extensions/claude-usage@indri.studio/extension.js
          test -f /usr/share/gnome-shell/extensions/claude-usage@indri.studio/schemas/gschemas.compiled
          test -f /usr/share/glib-2.0/schemas/org.gnome.shell.extensions.claude-usage.gschema.xml
          # Desktop entry, icons, systemd unit
          test -f /usr/share/applications/claude-usage.desktop
          test -f /usr/share/pixmaps/claude-usage.png
          test -f /usr/share/icons/hicolor/64x64/apps/claude-usage.png
          test -f /usr/lib/systemd/user/claude-usage-fetch.service
          # CLI smoke + script-syntax sanity
          /usr/bin/claude-usage-status -h >/dev/null
          python3 -m py_compile /usr/share/claude-usage/generate-icon.py
          python3 -m py_compile /usr/share/claude-usage/usage-server.py
          bash -n /usr/bin/claude-usage-setup
          # Removal must clear the system-wide schema (postrm)
          apt-get remove -y claude-usage
          test ! -f /usr/share/glib-2.0/schemas/org.gnome.shell.extensions.claude-usage.gschema.xml
          echo "OK"
        '

  release:
    desc: Build .deb + Chrome zip, tag, and publish a GitHub release (VERSION= to override)
    deps: [build, build-chrome-zip]
    vars:
      TAG: v{{.VERSION}}
    cmds:
      - |
        set -euo pipefail
        current=$(git rev-parse --abbrev-ref HEAD)
        if [ "$current" != "main" ]; then
          echo "Refusing to release from non-main branch: $current"
          exit 1
        fi
        if git rev-parse "{{.TAG}}" >/dev/null 2>&1; then
          echo "Tag {{.TAG}} already exists — bump Version in packaging/control first"
          exit 1
        fi
      - git push origin main
      - git tag "{{.TAG}}"
      - git push origin "{{.TAG}}"
      - |
        gh release create "{{.TAG}}" "{{.DEB}}" "{{.CHROME_ZIP}}" \
          --title "Claude Usage {{.TAG}}" \
          --generate-notes
      - echo "Released {{.TAG}} — $(gh release view {{.TAG}} --json url -q .url)"

  md:
    desc: Preview a markdown file in the browser
    cmds:
      - bash ../python-tui-lib/scripts/md-to-pdf.sh {{.CLI_ARGS}}
