version: "3"

vars:
  VERSION:
    sh: |
      v=$(grep '^Version:' packaging/control | awk '{print $2}')
      if [ -z "$v" ]; then
        echo "ERROR: no Version: line in packaging/control" >&2
        exit 1
      fi
      echo "$v"
  DEB: dist/claude-usage_{{.VERSION}}_all.deb
  CHROME_ZIP: dist/claude-usage-chrome-{{.VERSION}}.zip
  FIREFOX_ZIP: dist/claude-usage-firefox-{{.VERSION}}.zip

tasks:
  test-scraper:
    desc: Run browser extension unit tests (scraper + background load-smoke + Firefox compat shim)
    cmds:
      - node --test chrome-extension/test/scraper.test.js chrome-extension/test/background-load.test.js chrome-extension/test/background-runtime.test.js chrome-extension/test/firefox-compat.test.js

  test-validate:
    desc: Run server-side validator pytest suite (input contract for usage-server.py)
    cmds:
      - python3 -m pytest server/tests/ -v

  test-gnome-format:
    desc: "Unit tests for extension.js's pure popup formatters (formatRows/formatReset/bar), extracted + run under node"
    cmds:
      - node --test desktop/gnome/test/format.test.js

  lint-scraper-parity:
    desc: "Parity lints for hand-synced pairs: scraper.js↔background.js inline (regex sets) and pacingPct↔pacing_pct (numeric constants)"
    cmds:
      - python3 scripts/lint-scraper-parity.py

  lint-security-doc:
    desc: "SD-1 (pass-18): assert SECURITY.md's outbound-URL claim matches chrome-extension/manifest.json host_permissions"
    cmds:
      - python3 scripts/lint-security-doc.py

  lint-firefox-manifest:
    desc: "FF-1: assert the generated Firefox manifest mirrors chrome-extension/manifest.json (permissions, host_permissions, version) and carries the gecko id + compat shim"
    cmds:
      - python3 scripts/gen-firefox-manifest.py --check

  gen-js-defaults:
    desc: "JS-1 (pass-18): regenerate desktop/gnome/_defaults.js from the gschema XML"
    cmds:
      - python3 scripts/gen-js-defaults.py

  lint-js-defaults:
    desc: "JS-1 (pass-18): assert desktop/gnome/_defaults.js is in sync with the gschema XML"
    cmds:
      - python3 scripts/gen-js-defaults.py --check

  lint-kde-parity:
    desc: "KDE plasmoid lints: StandardPaths import, usage.json field allowlist, main.xml↔gschema default parity"
    cmds:
      - python3 scripts/lint-kde-parity.py

  lint-qml:
    desc: "qmllint structural gate for the KDE plasmoid. Uses the host qmllint when new enough (>=6.5), else a pinned ubuntu:26.04 container (Qt 6.10), else skips."
    cmds:
      - |
        set -euo pipefail
        files=$(find desktop/kde/contents -name '*.qml' | sort)
        # The Plasma QML modules (org.kde.plasma.*, Kirigami) aren't installed in
        # CI, so qmllint can't resolve PlasmoidItem / Plasma5Support / the cfg_*
        # config aliases and floods unresolved-type/-alias/missing-property/import
        # warnings. That's environment noise, not a regression — semantic checks
        # (phantom usage.json fields, main.xml↔gschema default drift, missing
        # StandardPaths import) live in scripts/lint-kde-parity.py. We disable the
        # module-resolution categories and keep qmllint as a SYNTAX/structural gate.
        #
        # Those granular --<category> flags only exist in qmllint >= 6.5; the GH
        # ubuntu-24.04 runner ships Qt 6.4 and rejects them (exit 201). So prefer
        # the host qmllint when it's new enough, else run a pinned ubuntu:26.04
        # container (Foundry's base suite "resolute", Qt 6.10). Full type-checking
        # — modules resolved, nothing suppressed — would want a foundry-desktop
        # image with Plasma 6 present (see TODO).
        FLAGS="--max-warnings 0 --import disable --unqualified disable --unresolved-type disable --missing-property disable --unused-imports disable --unresolved-alias disable"
        host=$(command -v qmllint || command -v qmllint-qt6 || true)
        if [ -z "$host" ] && [ -x /usr/lib/qt6/bin/qmllint ]; then host=/usr/lib/qt6/bin/qmllint; fi
        if [ -n "$host" ] && "$host" --help 2>&1 | grep -q -- '--unresolved-alias'; then
          "$host" $FLAGS $files
          echo "lint-qml: OK ($(echo "$files" | grep -c . ) QML files parse cleanly via host $("$host" --version))"
        elif command -v docker >/dev/null 2>&1; then
          echo "lint-qml: host qmllint too old/absent — running in pinned ubuntu:26.04 container"
          docker run --rm -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -e "FLAGS=$FLAGS" \
            -v "$PWD/desktop/kde:/kde:ro" ubuntu:26.04 bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
              ql=/usr/lib/qt6/bin/qmllint
              files=$(find /kde/contents -name "*.qml" | sort)
              "$ql" $FLAGS $files
              echo "lint-qml: OK ($(echo "$files" | grep -c . ) QML files parse cleanly via $("$ql" --version), 26.04 container)"
            '
        else
          echo "lint-qml: skipped — host qmllint is < 6.5 (or absent) and docker is unavailable"
        fi

  lint-gnome:
    desc: "Static checks for desktop/gnome/extension.js: JS syntax + GNOME Shell API symbol verification against the installed libshell binary"
    cmds:
      - |
        node --check desktop/gnome/extension.js && echo "lint-gnome: syntax OK"
      - |
        set -euo pipefail
        lib=$(ls /usr/lib/gnome-shell/libshell-*.so 2>/dev/null | head -1 || true)
        if [ -z "$lib" ]; then
          echo "lint-gnome: no libshell-*.so found — skipping API symbol checks"
          exit 0
        fi
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        LC_ALL=C strings "$lib" > "$tmp"
        ok=true
        check() {
          if grep -qF "$1" "$tmp"; then
            echo "lint-gnome: PRESENT  $1"
          else
            echo "lint-gnome: MISSING  $1" >&2
            ok=false
          fi
        }
        check 'getSystemSource'
        check 'isTransient'
        check 'addAction(label, callback)'
        check 'launch_default_for_uri'
        $ok && echo "lint-gnome: all API symbols verified"
      - |
        set -euo pipefail
        # Source guards for fixes in extension.js (no unit-test harness exists —
        # gjs `resource:///` imports can't be loaded under node). These assert
        # the 2026-05-30 review fixes can't be silently removed.
        ext=desktop/gnome/extension.js
        fail=0
        # DIFF-1: broken-tier notify must keep the GNOME-45 fallback.
        grep -qF "typeof MessageTray.getSystemSource === 'function'" "$ext" \
          || { echo "lint-gnome: MISSING getSystemSource feature-detect (DIFF-1 regression)" >&2; fail=1; }
        grep -qF "Main.notify('Claude Usage', reason" "$ext" \
          || { echo "lint-gnome: MISSING Main.notify GNOME-45 fallback (DIFF-1 regression)" >&2; fail=1; }
        # BASE-6a: panel age must be clamped >= 0 (future _timestamp).
        grep -qF "Math.max(0, Math.round((Date.now() / 1000 - d._timestamp)" "$ext" \
          || { echo "lint-gnome: MISSING age>=0 clamp (BASE-6a regression)" >&2; fail=1; }
        [ "$fail" -eq 0 ] && echo "lint-gnome: extension.js source guards OK (DIFF-1, BASE-6a)"
        exit "$fail"

  test:
    desc: Run all unit tests + parity/security lints
    cmds:
      - task: test-scraper
      - task: test-validate
      - task: test-gnome-format
      - task: lint-scraper-parity
      - task: lint-security-doc
      - task: lint-firefox-manifest
      - task: lint-js-defaults
      - task: lint-kde-parity
      - task: lint-qml
      - task: lint-gnome

  build:
    desc: Build the .deb package
    cmds:
      - bash packaging/build-deb.sh
    generates:
      - "{{.DEB}}"

  build-chrome-zip:
    desc: Build the Chrome extension zip for CWS upload
    cmds:
      - bash packaging/build-chrome-zip.sh
    generates:
      - "{{.CHROME_ZIP}}"

  build-firefox-zip:
    desc: "Build the Firefox extension zip (generated manifest + chrome→browser shim over the shared chrome-extension/ source). Sign for permanent install via web-ext sign --channel=unlisted."
    cmds:
      - bash packaging/build-firefox-zip.sh
    generates:
      - "{{.FIREFOX_ZIP}}"

  test-deb:
    desc: "Install + verify .deb in a clean Ubuntu 24.04 container (validates Depends end-to-end; ~7 min cold, ~4 min warm)"
    deps: [build]
    cmds:
      - |
        # Apt cache reused across runs via docker named volumes.
        # Bust with: docker volume rm claude-usage-apt-archives claude-usage-apt-lists
        docker run --rm \
          -v "$PWD/dist:/dist:ro" \
          -v "$PWD/packaging/test-deb-verify.sh:/usr/local/bin/verify:ro" \
          -v claude-usage-apt-archives:/var/cache/apt/archives \
          -v claude-usage-apt-lists:/var/lib/apt/lists \
          ubuntu:24.04 bash -c '
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y /dist/claude-usage_{{.VERSION}}_all.deb
          /usr/local/bin/verify
        '

  build-test-image:
    desc: Build claude-usage-test:latest with all .deb deps prebaked (rebuilds when packaging/control changes)
    sources:
      - packaging/control
      - packaging/test-deb.Dockerfile
    cmds:
      - |
        # Strip version constraints and commas from the Depends: line so we can
        # feed it straight to `apt-get install` inside the Dockerfile.
        deps=$(grep '^Depends:' packaging/control | sed 's/^Depends: //; s/([^)]*)//g; s/,//g')
        echo "Building claude-usage-test:latest with deps: $deps"
        docker build \
          --build-arg DEPS="$deps" \
          -f packaging/test-deb.Dockerfile \
          -t claude-usage-test:latest \
          packaging/

  test-deb-fast:
    desc: "Install + verify .deb on the prebaked image (~10 s; assumes Depends still resolves — use test-deb before release)"
    deps: [build, build-test-image]
    cmds:
      - |
        docker run --rm \
          -v "$PWD/dist:/dist:ro" \
          -v "$PWD/packaging/test-deb-verify.sh:/usr/local/bin/verify:ro" \
          claude-usage-test:latest bash -c '
          set -euo pipefail
          dpkg -i /dist/claude-usage_{{.VERSION}}_all.deb
          /usr/local/bin/verify
        '

  test-gnome:
    desc: "Smoke-test GNOME extension loading on a given Ubuntu release via Docker headless gnome-shell (UBUNTU_VERSION=26.04)"
    vars:
      UBUNTU_VERSION: '{{.UBUNTU_VERSION | default "26.04"}}'
    cmds:
      - >
        docker build
        --build-arg UBUNTU_VERSION={{.UBUNTU_VERSION}}
        -f packaging/test-gnome.Dockerfile
        -t claude-usage-gnome-{{.UBUNTU_VERSION}} .
      - docker run --rm claude-usage-gnome-{{.UBUNTU_VERSION}}

  bump:
    desc: "Bump version across packaging/control + chrome-extension/manifest.json (NEW=X.Y.Z). Pass-17 P-2: kills the manual two-place sync that auto-memory used to track."
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.NEW}}" ]; then
          echo "Usage: task bump NEW=X.Y.Z" >&2
          exit 1
        fi
        if ! echo "{{.NEW}}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Invalid version {{.NEW}} (expected X.Y.Z)" >&2
          exit 1
        fi
        sed -i "s/^Version: .*/Version: {{.NEW}}/" packaging/control
        python3 -c "import json,pathlib; p=pathlib.Path('chrome-extension/manifest.json'); d=json.loads(p.read_text()); d['version']='{{.NEW}}'; p.write_text(json.dumps(d,indent=2)+'\n')"
        echo "Bumped to {{.NEW}}. Review:"
        grep '^Version:' packaging/control
        grep '"version"' chrome-extension/manifest.json
        echo "Note: desktop/gnome/metadata.json's integer version is bumped automatically by 'task release'."

  release:
    desc: Preflight checks, tag, and push — CI builds and publishes the release (VERSION= to override)
    vars:
      TAG: v{{.VERSION}}
    cmds:
      - task: test
      - |
        set -euo pipefail
        current=$(git rev-parse --abbrev-ref HEAD)
        if [ "$current" != "main" ]; then
          echo "Refusing to release from non-main branch: $current"
          exit 1
        fi
        # docs/transcripts/ holds auto-generated session logs that almost
        # always have pending edits when `task release` runs. They get
        # committed separately via housekeeping commits (e.g. `chore:
        # session transcript through X`); excluding them here keeps the
        # release flow from tripping on benign churn.
        if ! git diff --quiet HEAD -- . ':(exclude)docs/transcripts/'; then
          echo "Refusing to release with uncommitted changes (transcripts excluded):" >&2
          git status --short -- . ':(exclude)docs/transcripts/'
          exit 1
        fi
        if git rev-parse "{{.TAG}}" >/dev/null 2>&1; then
          echo "Tag {{.TAG}} already exists — bump Version in packaging/control first"
          exit 1
        fi
        # packaging/control and chrome-extension/manifest.json must agree on
        # the version string — they ship in the same release and a drift
        # produces a .deb labelled X and a Chrome zip labelled Y.
        ctl_ver=$(grep '^Version:' packaging/control | awk '{print $2}')
        ext_ver=$(python3 -c 'import json; print(json.load(open("chrome-extension/manifest.json"))["version"])')
        if [ "$ctl_ver" != "$ext_ver" ]; then
          echo "Version mismatch: packaging/control=$ctl_ver, chrome-extension/manifest.json=$ext_ver" >&2
          exit 1
        fi
        # Auto-increment the GNOME extension integer version (EGO requirement).
        # Runs after all guards so a wrong-branch/dirty-tree abort never mutates the file.
        python3 -c "import json,pathlib; p=pathlib.Path('desktop/gnome/metadata.json'); d=json.loads(p.read_text()); d['version']+=1; p.write_text(json.dumps(d,indent=2)+chr(10))"
        git add desktop/gnome/metadata.json
        git commit -m "chore: bump gnome extension version for release"
      - git push origin main
      - git tag "{{.TAG}}"
      - git push origin "{{.TAG}}"
      - |
        echo "Tag {{.TAG}} pushed — GitHub Actions will build, test, and publish the release."
        rm -f dist/*.deb dist/*.zip
        echo "Local dist/ artifacts removed (CI uploads the canonical copies)."

  install-kde:
    desc: Install KDE plasmoid for the current user
    cmds:
      - rsync -a desktop/kde/ ~/.local/share/plasma/plasmoids/org.indri.claude-usage/
      - echo "Plasmoid installed. Restart Plasma shell to load the widget."

  uninstall-kde:
    desc: Remove KDE plasmoid
    cmds:
      - rm -rf ~/.local/share/plasma/plasmoids/org.indri.claude-usage
      - echo "Plasmoid removed."

  test-kde-live:
    desc: "Verify the plasmoid live on a real Plasma 6 session (boots the Foundry ISO in QEMU). Pass ISO=path to override; defaults to newest foundry-anvil-*.iso."
    cmds:
      - bash scripts/test-kde-qemu.sh {{.ISO}}

  md:
    desc: Preview a markdown file in the browser
    cmds:
      - bash ../python-tui-lib/scripts/md-to-pdf.sh {{.CLI_ARGS}}
